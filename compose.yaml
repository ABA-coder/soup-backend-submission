services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - queue-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
  workers:
    build: .
    command: ["python", "-m", "queue_service.supervisor", "--workers", "4"]
    init: true
    volumes:
      - queue-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
  chaos:
    build: .
    profiles: ["test"]
    init: true
    command: ["python", "-m", "harness.chaos", "--jobs", "10000", "--workers", "8", "--output", "/evidence"]
    volumes:
      - ./evidence:/evidence
volumes:
  queue-data:
