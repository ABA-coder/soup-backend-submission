name: Queue correctness and Linux chaos
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m harness.run_tests
      - run: python -m harness.chaos --seed 1
      - run: python -m harness.chaos --seed 2
      - run: python -m harness.chaos --mode load --jobs 3000 --rate 100
      - run: docker compose config --quiet && docker compose up --build --wait
      - run: curl --fail http://127.0.0.1:8000/health
      - if: always()
        run: docker compose logs > evidence/compose.log 2>&1; docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-raw-evidence
          path: evidence/
